<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Interest Calculator</title>
</head>

<body>
    <center>
        <h1 style="color:blue">Simple Interest Calculator</h1>

        <form method="post">
            <input type="number" step="any" name="p" placeholder="Principal Amount">
            <input type="number" step="any" name="t" placeholder="Time">
            <input type="number" step="any" name="r" placeholder="Rate">
            <button type="submit">Calculate Interest</button>
        </form>

        {# Display output #}
        {% if result %}
            <hr>
            <h3>Result:</h3>

            <span>Principal: {{ p }}</span><br>
            <span>Rate: {{ r }}</span><br>
            <span>Time: {{ t }}</span><br>

            <b>₹ Simple Interest - {{ result }}</b><br>
            <b>Total Amount - {{ total }}</b>
        {% endif %}

    </center>
</body>
</html>
